name: Deploy to master

on:
  push:
    branches: [v2]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run release

      - uses: actions/checkout@v4
        with:
          ref: master
          path: master-branch

      - name: Update bundle and push
        run: |
          cp dist/bundle.js master-branch/dist/bundle.js
          cd master-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/bundle.js
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "[AUTO-UPDATE] Update App"
          git push
